[Rainmeter]
Update=1000
BackgroundMode=2
SkinWidth=650
SkinHeight=430
SolidColor=15,18,22,100

[Variables]
DataFile="#CURRENTPATH#ilo_parsed.txt"

; ==================================================
; TELEMETRY HARVESTING ENGINE (8-WAY MULTI-STREAM)
; ==================================================

[MeasureParentRaw]
Measure=WebParser
URL=file://#DataFile#
UpdateRate=1
RegExp=(?si)^([\d\.]+),([\d\.]+),([\d\.]+),([\d\.]+),([\d\.]+),([\d\.]+),([\d\.]+),([\d\.]+)

; ==================================================
; SENSOR MEASURES (RAM DATA INTERCEPT ENGINE)
; ==================================================

[MeasureAmbientTemp]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=1
MinValue=0
MaxValue=40

[MeasureCpuTemp]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=2
MinValue=0
; FIXED CEILING: Raised to 105°C to handle active workload heat spikes perfectly
MaxValue=105

[MeasureFan1Speed]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=3
MinValue=0
MaxValue=100

[MeasureFan2Speed]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=4
MinValue=0
MaxValue=100

[MeasureFan3Speed]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=5
MinValue=0
MaxValue=100

[MeasureRamLoad]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=6
MinValue=0
MaxValue=100

[MeasureCpuPower]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=7
MinValue=0
MaxValue=150
; FIXED STRING: Drops the trailing decimal places for a clean integer readout
NumOfDecimals=0

[MeasureDriveTemp]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=8
MinValue=0
MaxValue=65

; ==================================================
; VISUAL DASHBOARD DESIGN (METERS)
; ==================================================

[MeterBackgroundImage]
Meter=Image
ImageName="#CURRENTPATH#background.jpg"
X=0
Y=0
W=650
H=430
Tile=0
PreserveAspectRatio=2
ImageAlpha=191

[MeterHeaderBackground]
Meter=Image
X=0
Y=0
W=650
H=40
SolidColor=24,30,38,180

[MeterTitle]
Meter=String
Text=HPE PROLIANT GEN9 LIVE FULL FEED
X=325
Y=11
FontColor=0,200,255,255
FontSize=11
FontFace=Segoe UI
FontWeight=800
StringAlign=Center
AntiAlias=1

; --- ROW 1: INLET AMBIENT ---
[MeterAmbientLabel]
Meter=String
Text="Ambient Inlet Temp"
X=20
Y=55
FontColor=240,245,250,255
FontSize=11
FontFace=Segoe UI
FontWeight=600
AntiAlias=1

[MeterAmbientValue]
Meter=String
MeasureName=MeasureAmbientTemp
X=630
Y=55
FontColor=255,220,100,255
FontSize=12
FontFace=Segoe UI
FontWeight=700
StringAlign=Right
AntiAlias=1
Text="%1°C"

[MeterAmbientBar]
Meter=Bar
MeasureName=MeasureAmbientTemp
