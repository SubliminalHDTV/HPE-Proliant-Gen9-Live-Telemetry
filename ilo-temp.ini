[Rainmeter]
Update=1000
BackgroundMode=2
SkinWidth=500
SkinHeight=300
SolidColor=15,18,22,240

[Variables]
; FIXED DIRECT LOCAL URL: Formatted cleanly for the internal WebParser file system cache
DataFile="file:///#CURRENTPATH#ilo_parsed.txt"

; ==================================================
; TELEMETRY HARVESTING ENGINE (ZERO-FLICKER STREAM)
; ==================================================

[MeasureParentRaw]
Measure=WebParser
URL=#DataFile#
; Native tracking divider checks the disk smoothly every 2 seconds
UpdateRate=2
RegExp=(?si)^([\d\.]+),([\d\.]+),([\d\.]+),([\d\.]+),([\d\.]+)

; ==================================================
; SENSOR MEASURES (HOLD VALUES SOLID IN RAM)
; ==================================================

[MeasureAmbientTemp]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=1
MinValue=0
MaxValue=40

[MeasureCpuTemp]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=2
MinValue=0
MaxValue=95

[MeasureFan1Speed]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=3
MinValue=0
MaxValue=100

[MeasureFan2Speed]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=4
MinValue=0
MaxValue=100

[MeasureFan3Speed]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=5
MinValue=0
MaxValue=100

; ==================================================
; VISUAL DASHBOARD DESIGN (METERS)
; ==================================================

[MeterHeaderBackground]
Meter=Image
X=0
Y=0
W=500
H=40
SolidColor=24,30,38,255

[MeterTitle]
Meter=String
Text=HPE PROLIANT GEN9 LIVE TELEMETRY
X=250
Y=11
FontColor=0,200,255,255
FontSize=11
FontFace=Segoe UI
FontWeight=800
StringAlign=Center
AntiAlias=1

; --- INLET AMBIENT ---
[MeterAmbientLabel]
Meter=String
Text="Inlet Ambient"
X=20
Y=55
FontColor=220,225,230,255
FontSize=11
FontFace=Segoe UI
FontWeight=600
AntiAlias=1

[MeterAmbientValue]
Meter=String
MeasureName=MeasureAmbientTemp
X=480
Y=55
FontColor=255,220,100,255
FontSize=12
FontFace=Segoe UI
FontWeight=700
StringAlign=Right
AntiAlias=1
Text="%1°C"

[MeterAmbientBar]
Meter=Bar
MeasureName=MeasureAmbientTemp
X=20
Y=80
W=460
H=8
BarColor=0,180,255,230
SolidColor=40,48,56,255
BarOrientation=Horizontal

