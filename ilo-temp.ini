[Rainmeter]
Update=1000
BackgroundMode=2
SkinWidth=500
; AUTO-SCALE HEIGHT: Left blank so the canvas dynamically matches your image's aspect ratio
SkinHeight=
SolidColor=15,18,22,100

[Variables]
DataFile="#CURRENTPATH#ilo_parsed.txt"

; ==================================================
; TELEMETRY HARVESTING ENGINE (ZERO-FLICKER STREAM)
; ==================================================

[MeasureParentRaw]
Measure=WebParser
URL=file://#DataFile#
UpdateRate=1
RegExp=(?si)^([\d\.]+),([\d\.]+),([\d\.]+),([\d\.]+),([\d\.]+)

; ==================================================
; SENSOR MEASURES (RAM DATA INTERCEPT MATRIX)
; ==================================================

[MeasureAmbientTemp]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=1
MinValue=0
MaxValue=40

[MeasureCpuTemp]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=2
MinValue=0
MaxValue=95

[MeasureFan1Speed]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=3
MinValue=0
MaxValue=100

[MeasureFan2Speed]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=4
MinValue=0
MaxValue=100

[MeasureFan3Speed]
Measure=WebParser
URL=[MeasureParentRaw]
StringIndex=5
MinValue=0
MaxValue=100

; ==================================================
; VISUAL DASHBOARD DESIGN (METERS & BACKGROUND)
; ==================================================

; --- BACK LAYER: TARGET BACKGROUND IMAGE ---
[MeterBackgroundImage]
Meter=Image
ImageName="#CURRENTPATH#background.jpg"
X=0
Y=0
W=500
; Removes the hardcoded vertical size constraint
H=
Tile=0
; FIXED ASPECT RATIO GATEway: Forces Rainmeter to mirror your photo's exact proportions
PreserveAspectRatio=1
ImageAlpha=191

[MeterHeaderBackground]
Meter=Image
X=0
Y=0
W=500
H=40
SolidColor=24,30,38,180

[MeterTitle]
Meter=String
Text=HPE PROLIANT GEN9 LIVE TELEMETRY
X=250
Y=11
FontColor=0,200,255,255
FontSize=11
FontFace=Segoe UI
FontWeight=800
StringAlign=Center
AntiAlias=1

; --- ROW 1: INLET AMBIENT ---
[MeterAmbientLabel]
Meter=String
Text="Inlet Ambient"
X=20
Y=55
FontColor=240,245,250,255
FontSize=11
FontFace=Segoe UI
FontWeight=600
AntiAlias=1

[MeterAmbientValue]
Meter=String
MeasureName=MeasureAmbientTemp
X=480
Y=55
FontColor=255,220,100,255
FontSize=12
FontFace=Segoe UI
FontWeight=700
StringAlign=Right
AntiAlias=1
Text="%1°C"

[MeterAmbientBar]
Meter=Bar
MeasureName=MeasureAmbientTemp
X=20
Y=80
W=460
H=8
BarColor=0,180,255,230
SolidColor=40,48,56,150
BarOrientation=Horizontal

